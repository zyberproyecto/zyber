<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Registro | Cooperativa</title>
	<link rel="stylesheet" href="/css/estilos.css" />
	<link href="https://fonts.googleapis.com/css2?family=REM:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet" />
	<meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
	<!-- Header -->
	<header>
		<div class="container">
			<a href="#" id="logo">COOPERATIVA DE VIVIENDAS</a>
			<nav>
				<ul>
					<li><a href="/">INICIO</a></li>
					<li><a href="/planes">PLANES</a></li>
					<li><a href="/contacto">CONTACTO</a></li>
					<li><a href="/login" class="btn login-btn">INICIAR SESION</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<main class="container">
		<form id="registroForm" class="form-cliente" method="POST">
			<div class="form-group">
				<label for="ci_usuario">CI:</label>
				<input type="text" id="ci_usuario" name="ci_usuario" required />
			</div>

			<div class="form-group">
				<label for="primer_nombre">Primer Nombre:</label>
				<input type="text" id="primer_nombre" name="primer_nombre" required />
			</div>

			<div class="form-group">
				<label for="segundo_nombre">Segundo Nombre:</label>
				<input type="text" id="segundo_nombre" name="segundo_nombre" />
			</div>

			<div class="form-group">
				<label for="primer_apellido">Primer Apellido:</label>
				<input type="text" id="primer_apellido" name="primer_apellido" required />
			</div>

			<div class="form-group">
				<label for="segundo_apellido">Segundo Apellido:</label>
				<input type="text" id="segundo_apellido" name="segundo_apellido" />
			</div>

			<div class="form-group">
				<label for="password">Contraseña:</label>
				<input type="password" id="password" name="password" required />
			</div>

			<div class="form-group">
				<label for="confirm_password">Confirmar Contraseña:</label>
				<input type="password" id="confirm_password" name="confirm_password" required />
			</div>

			<button type="submit" class="btn">Registrarse</button>
		</form>
		<div id="error" style="color: red; text-align: center; margin-top: 10px"></div>
	</main>

	<!-- Footer -->
	<footer>
		<div class="container">
			<p>&copy; 2025 ZYBER S.A.S. Todos los derechos reservados.</p>
		</div>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	<script src="/js/registro.js"></script>
</body>
</html>
