<!DOCTYPE html>
	<html\tlang="es">

		<head>
			<meta charset="UTF-8" />
			<meta name="viewport" content="width=device-width,	initial-scale=1.0" />
			<title>Iniciar sesión | Cooperativa</title>
			<link rel="stylesheet" href="/css/estilos.css" />
			<link href="https://fonts.googleapis.com/css2?family=REM:ital,wght@0,100..900;1,100..900&display=swap"
			
				rel="stylesheet" />
				<meta name="csrf-token" content="{{ csrf_token() }}">
		</head>
		
		<body>
			<!--	Header	-->
			<header>
				<div class="container">
					<a href="#" id="logo">COOPERATIVA DE VIVIENDAS</a>
					<nav>
						<ul>
							<li><a href="/">INICIO</a></li>
							<li><a href="/planes">PLANES</a></li>
							<li><a href="/contacto">CONTACTO</a></li>
						</ul>
					</nav>
				</div>
			</header>
			<main class="container">
				<form id="loginForm" class="form-cliente">
					<h2 style="text-align:	center">Iniciar sesión</h2>
					<div class="form-group">
						<label for="usuario">Usuario:</label>
						<input type="text" id="usuario" name="usuario" required />
					</div>
					<div class="form-group">
						<label for="password">Contraseña:</label>
						<input type="password" id="password" name="password" required />
					</div>
					<button type="submit" class="btn">Entrar</button>
				</form>
				<div id="error" style="color:	red;	text-align:	center;	margin-top:	10px"></div>
			</main>
			
			<!-- Footer -->
			<footer>
				<div class="container">
					<p>&copy; 2025 ZYBER S.A.S. Todos los derechos reservados.</p>
				</div>
			</footer>
			<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
			<script src="/js/login.js"></script>
		</body>
		</html>
